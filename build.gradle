plugins {
    id 'java-library'
}

group = 'io.github.barrrssss'
version = '0.1.0'

java {
    // Java language level 11; compiled with the installed JDK (>= 11).
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // Test-only. No runtime dependencies (the library is pure, abstract code).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // Forward the opt-in benchmark/simulation flags (and a heap bump for the larger
    // sizes) to the forked test JVM. Both are off by default; DecoderBenchmark and
    // LossSimulation are @EnabledIfSystemProperty.
    ['ldpc.bench', 'ldpc.sim'].each { flag ->
        if (System.getProperty(flag) != null) {
            systemProperty flag, System.getProperty(flag)
            maxHeapSize = '2g'
        }
    }
}

// Regenerates the vectors inside the spec submodule. This repo is their single
// generator; ldpc-staircase-dotnet only verifies them. Only run it deliberately —
// the vectors are the cross-language oracle, so a diff here is a spec change that
// must be reviewed and committed in ldpc-staircase-spec.
tasks.register('generateVectors', JavaExec) {
    group = 'verification'
    description = 'Regenerates the conformance vectors in the spec submodule (spec change — review the diff).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.barrrssss.ldpcstaircase.VectorGenerator'
    args = [project.file('external/ldpc-staircase-spec/vectors').absolutePath]
}
